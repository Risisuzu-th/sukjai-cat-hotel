  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Mali', 'Kanit', -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
    background-color: var(--bg);
    background-image: var(--bg-image, none);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #3A2E1F;
    padding-bottom: 40px;
    min-height: 100vh;
    transition: background-color .3s;
  }
  .bg-overlay { display: none; position: fixed; inset: 0; background: rgba(251,246,236,0.86); z-index: -1; pointer-events: none; }
  body.has-bg-image .bg-overlay { display: block; }

  .header { background: var(--card); padding: 28px 20px 22px 20px; text-align: center; border-bottom: 2px solid var(--border); position: relative; transition: background-color .3s; }
  .header .brand { font-size: 26px; font-weight: 700; color: #4A3319; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; letter-spacing: 0.5px; }
  .header .sub { font-size: 12px; color: #A67C3D; margin-top: 4px; letter-spacing: 1px; }
  .staff-badge { position:absolute; top:14px; right:16px; font-size:11px; background:var(--primary); color:#fff; padding:5px 12px; border-radius:14px; font-weight:bold; cursor:pointer; }

  .wrap { max-width: 480px; margin: 20px auto 0 auto; padding: 0 16px; position: relative; z-index: 1; }

  .card { background:#fff; border-radius:14px; border:1px solid var(--border); padding:18px; margin-bottom:16px; }
  .card-title { font-size:17px; font-weight:700; color:#4A3319; margin-bottom:12px; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; }

  label { display:block; font-size:12px; color:#8A7454; margin-bottom:6px; margin-top:12px; }
  label:first-child { margin-top:0; }
  input[type=date], input[type=text], input[type=tel], input[type=password], input[type=number], select {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    font-size:14px; background:var(--bg); color:#3A2E1F;
  }
  input[type=file] { font-size:12px; margin-top:2px; }
  input:focus, select:focus { outline:none; border-color:#D9A441; }

  .zone-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .zone-card { border-radius:20px; padding:14px; cursor:pointer; border:2.5px solid transparent; background-size: cover; background-position: center; position: relative; overflow: hidden; transition: transform .15s; }
  .zone-card:active { transform: scale(0.97); }
  .zone-card.selected { border-color:#4A3319; transform: scale(1.02); }
  .zone-card .zt { font-weight:700; font-size:16.5px; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; }
  .zone-card .zs { font-size:11px; margin-top:2px; }
  .zone-card .zc { font-size:10.5px; margin-top:8px; opacity:0.8; }
  .zone-card .zpaw { position:absolute; top:8px; right:10px; width:20px; height:20px; opacity:0.35; }
  .z-sunny { background-color:#FFDD8A; color:#6B4A15; }
  .z-cozy  { background-color:#FFC2D9; color:#7A2E4B; }
  .z-cloud { background-color:#B8E0FB; color:#0C4C82; }
  .z-sig   { background-color:#D9C9FA; color:#4A3E8C; }

  .level-toggle { display:flex; gap:8px; margin-bottom:14px; }
  .level-btn { flex:1; padding:9px; border-radius:999px; border:2px solid var(--border); background:#fff; color:#8A7454; font-size:13px; font-weight:700; cursor:pointer; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; transition: transform .12s; }
  .level-btn:active { transform: scale(0.95); }
  .level-btn.active { background:var(--card); border-color:var(--primary); color:var(--primary); }
  .level-btn .paw-icon { width:13px; height:13px; opacity:0.6; }

  .room-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:9px; }
  .room-tile { aspect-ratio:1; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; cursor:pointer; border:2.5px solid transparent; text-align:center; background-size: cover; background-position: center; position:relative; transition: transform .12s; font-family: 'Kanit', 'Mali', sans-serif; }
  .room-tile:active { transform: scale(0.93); }
  .room-open { background-color:#FFE6B8; color:#6B4A15; }
  .room-open.selected { border-color:#4A3319; transform: scale(1.06); }
  .room-open.selected::after { content:''; position:absolute; bottom:3px; right:3px; width:14px; height:14px; background: var(--primary); border-radius:50%; }
  .room-taken { background-color:#EFEAE0; color:#B7AC96; cursor:not-allowed; }
  .room-closed { background-color:#F7E3E3; color:#A34C4C; cursor:not-allowed; font-size:10px; }
  .room-photo-badge { text-shadow: 0 1px 3px rgba(0,0,0,0.6); color:#fff; }

  .date-card-icon { display:inline-flex; align-items:center; gap:6px; }

  .room-photo-preview { width:100%; height:140px; border-radius:12px; object-fit:cover; margin-bottom:12px; }

  .btn { width:100%; padding:13px; border-radius:999px; border:none; font-size:16px; font-weight:700; cursor:pointer; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; letter-spacing: 0.3px; transition: transform .12s; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:disabled { background:#D9C39A; cursor:not-allowed; }
  .btn-ghost { background:#fff; border:1.5px solid var(--border); color:var(--primary); margin-top:8px; }
  .btn-small { width:auto; padding:8px 14px; font-size:12px; border-radius:999px; }
  .paw-icon { width:16px; height:16px; flex-shrink:0; }
  .paw-icon path, .paw-icon circle { fill: currentColor; }

  .summary-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; color:#5B4222; }
  .summary-row:last-child { border:none; font-weight:bold; color:#4A3319; padding-top:12px; font-size:14px; }
  .price-highlight { color: var(--primary); font-size: 16px; }

  .confirm-box { text-align:center; padding: 30px 10px; }
  .confirm-box .ci { font-size:44px; }
  .confirm-box .ct { font-size:22px; font-weight:bold; color:#4A3319; margin-top:10px; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; }
  .confirm-box .cs { font-size:13px; color:#8A7454; margin-top:6px; }
  .confirm-box .code { font-size:20px; font-weight:bold; color:var(--primary); margin-top:16px; letter-spacing:2px; background:#F7F1E4; display:inline-block; padding:8px 20px; border-radius:10px; }

  .error-text { color:#B7523F; font-size:12px; margin-top:8px; }
  .points-badge { background:#E6F1FB; border-radius:10px; padding:10px 12px; font-size:12px; color:#1D4E80; margin-top:10px; }
  .photo-preview { width:70px; height:70px; border-radius:10px; object-fit:cover; margin-top:8px; border:1px solid var(--border); }

  .staff-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .staff-tab-btn { flex:1; min-width:80px; padding:9px; border-radius:10px; border:1.5px solid var(--border); background:#fff; color:#8A7454; font-size:13px; font-weight:bold; cursor:pointer; font-family: 'FC Rooster', 'Kanit', 'Mali', sans-serif; }
  .staff-tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  .stat-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card { flex:1; min-width:100px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center; }
  .stat-card .sv { font-size:20px; font-weight:bold; color:#4A3319; }
  .stat-card .sl { font-size:10.5px; color:#8A7454; margin-top:2px; }

  .booking-item { background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; gap:12px; }
  .booking-item .bi-photo { width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#F1EAD8; }
  .booking-item .bi-body { flex:1; min-width:0; }
  .booking-item .bi-top { display:flex; justify-content:space-between; align-items:center; }
  .booking-item .bn { font-size:14px; font-weight:bold; color:#4A3319; }
  .booking-item .bd { font-size:12px; color:#8A7454; margin-top:4px; }
  .status-pill { font-size:10.5px; padding:3px 10px; border-radius:12px; font-weight:bold; flex-shrink:0; }
  .pill-active { background:#E0F0E0; color:#3B7A3B; }
  .pill-done { background:#F1EAD8; color:#8A7454; }
  .bi-actions { display:flex; gap:8px; margin-top:10px; }
  .bi-actions button { flex:1; padding:8px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:bold; color:var(--primary); cursor:pointer; }
  .bi-actions button.danger { color:#B7523F; }

  .room-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F1E9D5; gap:10px; }
  .room-row:last-child { border:none; }
  .room-row .rn { font-size:13px; font-weight:bold; color:#4A3319; }
  .room-row .rz { font-size:10.5px; color:#8A7454; }
  .room-row-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

<div id="appRoot"></div>

<script>
/* ====== CONFIGURE THIS AFTER DEPLOYING THE APPS SCRIPT WEB APP ====== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeU3VgCEmCtqBgezP7gNwoiI7gwRPTr2hMn0yUiqDhIzgHtEAv6lNGAKPIkPHAD-8fyg/exec';
/* ===================================================================== */

const PAW_ICON = '<svg class="paw-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="18" r="7"/><circle cx="44" cy="18" r="7"/><circle cx="10" cy="34" r="6"/><circle cx="54" cy="34" r="6"/><ellipse cx="32" cy="44" rx="18" ry="14"/></svg>';

const THEME_PRESETS = [
  { themeName: 'default', label: 'ปกติ', themePrimary: '#7A4A17', themeBg: '#FBF6EC', themeCard: '#F3E4C8' },
  { themeName: 'songkran', label: 'สงกรานต์', themePrimary: '#1D6FA5', themeBg: '#EAF4FB', themeCard: '#D8ECFA' },
  { themeName: 'cny', label: 'ตรุษจีน', themePrimary: '#B3272D', themeBg: '#FFF4E0', themeCard: '#F6D9A0' },
  { themeName: 'loykrathong', label: 'ลอยกระทง', themePrimary: '#5B3A8E', themeBg: '#F3EEFA', themeCard: '#E4D6F5' },
  { themeName: 'christmas', label: 'คริสต์มาส/ปีใหม่', themePrimary: '#2F6B3A', themeBg: '#F0F7F0', themeCard: '#D9EDD9' },
  { themeName: 'halloween', label: 'ฮาโลวีน', themePrimary: '#C1590C', themeBg: '#FFF1E5', themeCard: '#FFDDB0' }
];

const ZONES = {
  sunny: { name: 'Sunny Room', desc: 'สดใส อบอุ่น ขี้เล่น', cls: 'z-sunny',
    rooms: { STD: ['SS1','SS2','SS3','SS4','SS5','SS6','SS7','SS8','SS9'], VIP: ['SSV1','SSV2','SSV3'] } },
  cozy: { name: 'Cozy Room', desc: 'เงียบ อบอุ่น ปลอดภัย', cls: 'z-cozy',
    rooms: { STD: ['SC1','SC2','SC3','SC4','SC5','SC6','SC7','SC8','SC9','SC10','SC11'], VIP: ['SCV1','SCV2'] } },
  cloud: { name: 'Cloud Room', desc: 'พรีเมียม สงบ ลอยฟ้า', cls: 'z-cloud',
    rooms: { STD: ['SCL1','SCL2','SCL3','SCL4','SCL5','SCL6','SCL7','SCL8','SCL9','SCL10','SCL11','SCL12','SCL13','SCL14','SCL15','SCL16'], VIP: ['SCP1','SCP2','SCP3','SCP4','SCP5','SCP6','SCP7','SCP8'] } },
  signature: { name: 'Signature Room', desc: 'ห้องใหญ่ที่สุด เอ็กซ์คลูซีฟ', cls: 'z-sig',
    rooms: { VIP: ['SSR1'] } }
};
const ALL_ROOM_IDS = Object.values(ZONES).flatMap(z => Object.values(z.rooms).flat());

let state = {
  view: 'customer', role: null, pin: '',
  loginPin: '', loginError: '',
  staffTab: 'bookings',
  step: 1,
  checkin: '', checkout: '',
  zone: null, level: null, room: null,
  ownerName: '', ownerPhone: '', petName: '', petPhoto: null, petPhotoError: '', referralCodeUsed: '',
  lastBookingCode: null,
  bookings: [], roomStatus: {}, customers: [], roomPhotos: {}, pricing: [],
  theme: { themeName: 'default', themePrimary: '#7A4A17', themeBg: '#FBF6EC', themeCard: '#F3E4C8', themeBgImage: '' },
  report: null,
  settingsMsg: '', pricingMsg: '', themeMsg: '', bgMsg: '', coverMsg: '',
  pricingForm: { targetType: 'zone', targetValue: 'sunny', startDate: '', endDate: '', pricePerNight: '', note: '' },
  loading: true, apiError: ''
};

async function api(action, payload) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
    state.apiError = 'ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ในไฟล์นี้';
    return { error: state.apiError };
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload || {}))
    });
    return await res.json();
  } catch (err) {
    return { error: 'เชื่อมต่อระบบไม่ได้: ' + err.message };
  }
}

async function loadAll() {
  const data = await api('getData');
  if (data && !data.error) {
    state.bookings = data.bookings || [];
    state.roomStatus = data.roomStatus || {};
    state.customers = data.customers || [];
    state.roomPhotos = data.roomPhotos || {};
    state.pricing = data.pricing || [];
    if (data.theme) { state.theme = data.theme; applyTheme(state.theme); }
  }
  state.loading = false;
}

function applyTheme(theme) {
  document.documentElement.style.setProperty('--primary', theme.themePrimary || '#7A4A17');
  document.documentElement.style.setProperty('--bg', theme.themeBg || '#FBF6EC');
  document.documentElement.style.setProperty('--card', theme.themeCard || '#F3E4C8');
  if (theme.themeBgImage) {
    document.body.style.setProperty('--bg-image', "url('" + theme.themeBgImage + "')");
    document.body.classList.add('has-bg-image');
  } else {
    document.body.style.setProperty('--bg-image', 'none');
    document.body.classList.remove('has-bg-image');
  }
  const coverEl = document.getElementById('coverBanner');
  if (theme.themeCoverImage) {
    coverEl.src = theme.themeCoverImage;
    coverEl.style.display = 'block';
  } else {
    coverEl.style.display = 'none';
  }
}

function datesOverlap(aStart, aEnd, bStart, bEnd) { return aStart < bEnd && bStart < aEnd; }
function isRoomClosed(roomId) { return !!(state.roomStatus[roomId] && state.roomStatus[roomId].closed); }
function isRoomAvailable(roomId, checkin, checkout) {
  if (isRoomClosed(roomId)) return false;
  if (!checkin || !checkout) return true;
  return !state.bookings.some(b =>
    b.roomId === roomId && b.status === 'active' &&
    datesOverlap(checkin, checkout, b.checkin, b.checkout)
  );
}
function z_name(key) { return ZONES[key] ? ZONES[key].name : ''; }

function findPricingRule(roomId, zone, level, checkin) {
  const candidates = state.pricing.filter(r => r.startDate <= checkin && checkin <= r.endDate);
  const roomRule = candidates.find(r => r.targetType === 'room' && r.targetValue === roomId);
  if (roomRule) return roomRule;
  const zlRule = candidates.find(r => r.targetType === 'zone_level' && r.targetValue === (zone + ':' + level));
  if (zlRule) return zlRule;
  const zoneRule = candidates.find(r => r.targetType === 'zone' && r.targetValue === zone);
  if (zoneRule) return zoneRule;
  return null;
}
function estimateTotal(roomId, zone, level, checkin, checkout) {
  if (!checkin || !checkout) return null;
  const nights = Math.max(1, Math.round((new Date(checkout) - new Date(checkin)) / 86400000));
  const rule = findPricingRule(roomId, zone, level, checkin);
  if (!rule) return null;
  return { nights: nights, pricePerNight: Number(rule.pricePerNight), total: nights * Number(rule.pricePerNight) };
}

function openStaffLogin() { state.view = 'staff-login'; state.loginPin=''; state.loginError=''; render(); }
function backToCustomer() { state.view = 'customer'; render(); }

async function attemptLogin() {
  state.loginError = '';
  render();
  const res = await api('login', { pin: state.loginPin.trim() });
  if (res && res.role) {
    state.role = res.role; state.pin = state.loginPin.trim();
    state.view = 'staff'; state.staffTab = 'bookings';
  } else {
    state.loginError = (res && res.error) || 'รหัสไม่ถูกต้อง';
  }
  render();
}
function logoutStaff() { state.role = null; state.pin=''; state.view = 'customer'; render(); }

function resetBookingForm() {
  state.step = 1; state.checkin=''; state.checkout='';
  state.zone=null; state.level=null; state.room=null;
  state.ownerName=''; state.ownerPhone=''; state.petName=''; state.petPhoto=null; state.referralCodeUsed='';
  state.lastBookingCode = null;
}

const MAX_ORIGINAL_FILE_BYTES = 25 * 1024 * 1024; // 25MB original file cap — generous for modern phone photos

function resizeImageFile(file, maxDim, quality, onSuccess, onError) {
  onError = onError || function(msg) { alert(msg); };
  if (!file.type || file.type.indexOf('image/') !== 0) {
    onError('ไฟล์นี้ไม่ใช่รูปภาพ กรุณาเลือกไฟล์ JPG หรือ PNG');
    return;
  }
  const nameLower = (file.name || '').toLowerCase();
  if (file.type === 'image/heic' || file.type === 'image/heif' || nameLower.endsWith('.heic') || nameLower.endsWith('.heif')) {
    onError('ไฟล์นี้เป็นชนิด HEIC (รูปจาก iPhone) เบราว์เซอร์เปิดไม่ได้ กรุณาไปที่ตั้งค่ากล้อง iPhone > รูปแบบ > เลือก "เข้ากันได้มากที่สุด" แล้วถ่ายใหม่ หรือแคปหน้าจอรูปแล้วอัปโหลดรูปแคปแทน');
    return;
  }
  if (file.size > MAX_ORIGINAL_FILE_BYTES) {
    onError('ไฟล์รูปใหญ่เกินไป (' + (file.size/1024/1024).toFixed(1) + 'MB) กรุณาเลือกไฟล์ไม่เกิน 12MB');
    return;
  }
  const reader = new FileReader();
  reader.onerror = function() { onError('อ่านไฟล์รูปไม่สำเร็จ กรุณาลองรูปอื่น'); };
  reader.onload = function(e) {
    const img = new Image();
    img.onerror = function() { onError('เปิดไฟล์รูปนี้ไม่ได้ กรุณาลองรูปอื่น (แนะนำ JPG หรือ PNG)'); };
    img.onload = function() {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      onSuccess(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handlePhotoUpload(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  state.petPhotoError = '';
  resizeImageFile(file, 900, 0.8,
    (dataUrl) => { state.petPhoto = dataUrl; state.petPhotoError = ''; render(); },
    (msg) => { state.petPhotoError = msg; render(); }
  );
}

function findCustomerByPhone(phone) {
  return state.customers.find(c => c.phone === phone);
}

function renderCustomer() {
  const el = document.getElementById('appRoot');
  if (state.loading) { el.innerHTML = '<div class="wrap"><div class="loading">กำลังโหลดข้อมูล...</div></div>'; return; }

  if (state.step === 5) {
    el.innerHTML = '<div class="wrap">' +
      '<div class="card confirm-box">' +
        '<div class="ci">✅</div>' +
        '<div class="ct">จองสำเร็จ</div>' +
        '<div class="cs">' + ZONES[state.zone].name + ' · ห้อง ' + state.room + '<br>' + state.checkin + ' ถึง ' + state.checkout + '</div>' +
        '<div class="code">' + state.lastBookingCode + '</div>' +
        '<button class="btn btn-primary" style="margin-top:20px;" onclick="resetBookingForm(); render();">' + PAW_ICON + 'จองห้องใหม่</button>' +
      '</div>' + footerLink() + '</div>';
    return;
  }

  let html = '<div class="wrap">';

  html += '<div class="card">' +
    '<div class="card-title">1. เลือกวันที่</div>' +
    '<label>วันเช็คอิน</label>' +
    '<input type="date" id="inCheckin" value="' + state.checkin + '" onchange="onDateChange()">' +
    '<label>วันเช็คเอาท์</label>' +
    '<input type="date" id="inCheckout" value="' + state.checkout + '" onchange="onDateChange()">' +
    '<div id="dateError" class="error-text"></div></div>';

  if (state.checkin && state.checkout && state.checkin < state.checkout) {
    html += '<div class="card"><div class="card-title">2. เลือกโซนที่พัก</div><div class="zone-grid">';
    for (const key in ZONES) {
      const z = ZONES[key];
      const sel = state.zone === key ? 'selected' : '';
      const totalRooms = Object.values(z.rooms).flat().length;
      const availCount = Object.values(z.rooms).flat().filter(r => isRoomAvailable(r, state.checkin, state.checkout)).length;
      html += '<div class="zone-card ' + z.cls + ' ' + sel + '" onclick="selectZone(\'' + key + '\')">' +
        PAW_ICON.replace('paw-icon', 'paw-icon zpaw') +
        '<div class="zt">' + z.name + '</div><div class="zs">' + z.desc + '</div>' +
        '<div class="zc">ว่าง ' + availCount + '/' + totalRooms + ' ห้อง</div></div>';
    }
    html += '</div></div>';
  }

  if (state.zone) {
    const z = ZONES[state.zone];
    const levels = Object.keys(z.rooms);
    if (!state.level) state.level = levels[0];
    html += '<div class="card"><div class="card-title">3. เลือกห้อง — ' + z.name + '</div>';
    if (levels.length > 1) {
      html += '<div class="level-toggle">';
      for (const lv of levels) html += '<div class="level-btn ' + (state.level===lv?'active':'') + '" onclick="selectLevel(\'' + lv + '\')">' + PAW_ICON + lv + '</div>';
      html += '</div>';
    }
    html += '<div class="room-grid">';
    for (const r of z.rooms[state.level]) {
      if (isRoomClosed(r)) { html += '<div class="room-tile room-closed">' + r + '<br>ปิดปรับปรุง</div>'; continue; }
      const avail = isRoomAvailable(r, state.checkin, state.checkout);
      const sel = state.room===r?'selected':'';
      const photo = state.roomPhotos[r];
      const bgStyle = photo ? 'style="background-image:url(\'' + photo + '\');"' : '';
      const labelCls = photo ? 'room-photo-badge' : '';
      html += '<div class="room-tile ' + (avail?'room-open '+sel:'room-taken') + '" ' + bgStyle + ' onclick="' + (avail?'selectRoom(\''+r+'\')':'') + '"><span class="' + labelCls + '">' + r + '</span></div>';
    }
    html += '</div></div>';
  }

  if (state.room) {
    const existingCustomer = state.ownerPhone.length >= 9 ? findCustomerByPhone(state.ownerPhone) : null;
    const roomPhoto = state.roomPhotos[state.room];
    const priceInfo = estimateTotal(state.room, state.zone, state.level, state.checkin, state.checkout);

    html += '<div class="card">' +
      '<div class="card-title">4. ข้อมูลเจ้าของ &amp; น้องแมว</div>' +

      '<label>ชื่อเจ้าของ</label>' +
      '<input type="text" id="inOwner" placeholder="เช่น คุณมิ้น" value="' + state.ownerName + '" oninput="state.ownerName=this.value">' +
      '<label>เบอร์โทร</label>' +
      '<input type="tel" id="inPhone" placeholder="08X-XXX-XXXX" value="' + state.ownerPhone + '" oninput="state.ownerPhone=this.value; render();">' +
      (existingCustomer ? '<div class="points-badge">🎉 ยินดีต้อนรับกลับ ' + existingCustomer.ownerName + ' — สะสมแล้ว ' + (existingCustomer.points || 0) + ' แต้ม</div>' : '') +
      '<label>ชื่อแมว</label>' +
      '<input type="text" id="inPet" placeholder="เช่น น้องส้ม" value="' + state.petName + '" oninput="state.petName=this.value">' +
      '<label>รูปน้องแมว (ถ้ามี — เก็บไว้เป็นประวัติใน Google Drive)</label>' +
      '<div class="upload-hint">อัปโหลดได้สูงสุด 25MB ต่อไฟล์ ระบบจะปรับความละเอียดให้อัตโนมัติ (ไฟล์ HEIC จาก iPhone ต้องแปลงเป็น JPG/PNG ก่อน)</div>' +
      '<input type="file" accept="image/*" onchange="handlePhotoUpload(event)">' +
      (state.petPhotoError ? '<div class="upload-error">' + state.petPhotoError + '</div>' : '') +
      (state.petPhoto ? '<img class="photo-preview" src="' + state.petPhoto + '">' : '') +
      '<label>โค้ดชวนเพื่อน (ถ้ามี)</label>' +
      '<input type="text" id="inReferral" placeholder="เช่น REFAB12" value="' + state.referralCodeUsed + '" oninput="state.referralCodeUsed=this.value">' +
    '</div>';

    html += '<div class="card">' +
      '<div class="card-title">สรุปการจอง</div>' +
      '<div class="summary-row"><span>ห้องพัก</span><span>' + z_name(state.zone) + ' · ' + state.room + '</span></div>' +
      '<div class="summary-row"><span>วันที่</span><span>' + state.checkin + ' - ' + state.checkout + '</span></div>' +
      '<div class="summary-row"><span>เจ้าของ / แมว</span><span>' + (state.ownerName || '-') + ' / ' + (state.petName || '-') + '</span></div>' +
      (priceInfo ?
        '<div class="summary-row"><span>ราคา</span><span>' + priceInfo.pricePerNight.toLocaleString() + ' บาท x ' + priceInfo.nights + ' คืน</span></div>' +
        '<div class="summary-row"><span>ยอดรวมโดยประมาณ</span><span class="price-highlight">' + priceInfo.total.toLocaleString() + ' บาท</span></div>'
        : '<div class="summary-row"><span>ราคา</span><span>ยังไม่ได้ตั้งราคาช่วงนี้</span></div>') +
    '</div>';

    html += '<button class="btn btn-primary" id="submitBtn" onclick="submitBooking()">' + PAW_ICON + 'ยืนยันการจอง</button>' +
      '<div id="formError" class="error-text"></div>';
  }

  html += footerLink() + '</div>';
  el.innerHTML = html;
}

function footerLink() {
  return '<div class="footer-link"><a href="#" onclick="openStaffLogin(); return false;">สำหรับเจ้าหน้าที่</a></div>';
}

function onDateChange() {
  state.checkin = document.getElementById('inCheckin').value;
  state.checkout = document.getElementById('inCheckout').value;
  const errEl = document.getElementById('dateError');
  if (state.checkin && state.checkout && state.checkin >= state.checkout) {
    errEl.textContent = 'วันเช็คเอาท์ต้องอยู่หลังวันเช็คอิน';
  } else { errEl.textContent = ''; state.room = null; }
  render();
}
function selectZone(key) { state.zone=key; state.level=null; state.room=null; render(); }
function selectLevel(lv) { state.level=lv; state.room=null; render(); }
function selectRoom(r) { state.room=r; render(); }

async function submitBooking() {
  const errEl = document.getElementById('formError');
  if (!state.ownerName.trim() || !state.ownerPhone.trim() || !state.petName.trim()) {
    errEl.textContent = 'กรุณากรอกข้อมูลเจ้าของและน้องแมวให้ครบ'; return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  const priceInfo = estimateTotal(state.room, state.zone, state.level, state.checkin, state.checkout);

  const res = await api('createBooking', {
    zone: state.zone, roomId: state.room, checkin: state.checkin, checkout: state.checkout,
    ownerName: state.ownerName.trim(), ownerPhone: state.ownerPhone.trim(), petName: state.petName.trim(),
    photoBase64: state.petPhoto, referralCodeUsed: state.referralCodeUsed.trim(),
    estimatedTotal: priceInfo ? priceInfo.total : null
  });

  if (res && res.id) {
    state.lastBookingCode = res.id;
    state.step = 5;
    await loadAll();
  } else {
    errEl.textContent = (res && res.error) || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
    btn.disabled = false; btn.innerHTML = PAW_ICON + 'ยืนยันการจอง';
  }
  render();
}

function pricingTargetValueOptions() {
  const f = state.pricingForm;
  if (f.targetType === 'zone') {
    return Object.keys(ZONES).map(k => '<option value="' + k + '" ' + (f.targetValue===k?'selected':'') + '>' + ZONES[k].name + '</option>').join('');
  }
  if (f.targetType === 'zone_level') {
    let opts = [];
    for (const k in ZONES) {
      const z = ZONES[k];
      for (const lv in z.rooms) {
        const val = k + ':' + lv;
        opts.push('<option value="' + val + '" ' + (f.targetValue===val?'selected':'') + '>' + z.name + ' - ' + lv + '</option>');
      }
    }
    return opts.join('');
  }
  let opts = [];
  for (const k in ZONES) {
    const z = ZONES[k];
    Object.values(z.rooms).flat().forEach(r => {
      opts.push('<option value="' + r + '" ' + (f.targetValue===r?'selected':'') + '>' + r + ' (' + z.name + ')</option>');
    });
  }
  return opts.join('');
}
function onPricingTargetTypeChange() {
  state.pricingForm.targetType = document.getElementById('prTargetType').value;
  state.pricingForm.targetValue = '';
  render();
  const sel = document.getElementById('prTargetValue');
  if (sel && sel.options.length) { state.pricingForm.targetValue = sel.options[0].value; sel.value = sel.options[0].value; }
}
function pricingTargetLabel(targetType, targetValue) {
  if (targetType === 'zone') return z_name(targetValue) + ' (ทั้งโซน)';
  if (targetType === 'zone_level') {
    const parts = targetValue.split(':');
    return z_name(parts[0]) + ' - ' + parts[1];
  }
  return 'ห้อง ' + targetValue;
}

async function submitPricingRule() {
  const f = state.pricingForm;
  if (!f.targetValue || !f.startDate || !f.endDate || !f.pricePerNight) {
    state.pricingMsg = 'กรอกข้อมูลให้ครบ'; render(); return;
  }
  const res = await api('setPricingRule', { rule: f, pin: state.pin });
  if (res && res.ok) {
    state.pricingMsg = '';
    state.pricingForm = { targetType: 'zone', targetValue: 'sunny', startDate: '', endDate: '', pricePerNight: '', note: '' };
    await loadAll();
  } else {
    state.pricingMsg = (res && res.error) || 'เกิดข้อผิดพลาด';

  render();
}

  } else {

async function saveSettingsPins() {

  const newSuper = document.getElementById('inSuperPin').value.trim();
  const res = await api('updatePins', { newAdminPin: newAdmin, newSuperPin: newSuper, currentPin: state.pin });
  if (res && res.ok) {
    state.settingsMsg = 'บันทึกรหัสผ่านเรียบร้อย';
    if (newAdmin) state.pin = state.role === 'admin' ? newAdmin : state.pin;

  } else {
    state.settingsMsg = '';
    alert((res && res.error) || 'เกิดข้อผิดพลาด');
  }
  render();
}

function staffReportHtml() {
  if (!state.report) return '<div class="loading">กำลังโหลดรายงาน...</div>';
  const r = state.report;
  let zoneRows = '';
  for (const key in (r.zoneCounts || {})) {
    zoneRows += '<div class="rank-row"><span>' + z_name(key) + '</span><span>' + r.zoneCounts[key] + ' ครั้ง</span></div>';
  }
  let topRows = '';
  (r.topCustomers || []).forEach((c, i) => {
    topRows += '<div class="rank-row"><span>' + (i+1) + '. ' + c.ownerName + '</span><span>' + (c.points || 0) + ' แต้ม</span></div>';
  });
  return '<div class="stat-row">' +
      '<div class="stat-card"><div class="sv">' + r.totalBookings + '</div><div class="sl">การจองทั้งหมด</div></div>' +
      '<div class="stat-card"><div class="sv">' + r.activeNow + '</div><div class="sl">กำลังเข้าพัก</div></div>' +
      '<div class="stat-card"><div class="sv">' + r.totalCustomers + '</div><div class="sl">ลูกค้าทั้งหมด</div></div>' +
      '<div class="stat-card"><div class="sv">' + r.referralBookings + '</div><div class="sl">มาจากการชวนเพื่อน</div></div>' +
    '</div>' +
    '<div class="card"><div class="card-title">การจองแยกตามโซน</div>' + (zoneRows || '<div class="empty-state">ยังไม่มีข้อมูล</div>') + '</div>' +
    '<div class="card"><div class="card-title">ลูกค้าแต้มสะสมสูงสุด</div>' + (topRows || '<div class="empty-state">ยังไม่มีข้อมูล</div>') + '</div>';
}

async function loadReport() {
  const res = await api('getReport', { pin: state.pin });
  state.report = res && !res.error ? res : { totalBookings:0, activeNow:0, zoneCounts:{}, referralBookings:0, totalCustomers:0, topCustomers:[] };
  render();
}

function render() {
  const badgeEl = document.getElementById('staffBadge');
  if (state.view === 'staff' && state.role) {
    badgeEl.innerHTML = '<div class="staff-badge" onclick="logoutStaff()">' + (state.role==='superadmin'?'ผู้ดูแลระบบ':'แอดมิน') + ' · ออกจากระบบ</div>';
  } else badgeEl.innerHTML = '';

  const banner = document.getElementById('setupBanner');
  banner.innerHTML = state.apiError ? '<div class="setup-banner">⚠️ ' + state.apiError + ' — โปรดตั้งค่า APPS_SCRIPT_URL ในไฟล์ index.html</div>' : '';

  if (state.view === 'customer') renderCustomer();
  else if (state.view === 'staff-login') renderStaffLogin();
  else if (state.view === 'staff') renderStaff();
}

(async function init() {
  render();
  await loadAll();
  render();
})();
</script>
</body>
</html>
